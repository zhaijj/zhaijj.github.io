<style>
@keyframes pulse {
  0% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.6; transform: scale(1.2); }
  100% { opacity: 1; transform: scale(1); }
}

#pageview-map {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

@media (max-width: 768px) {
  #pageview-map {
    width: 250px;
    height: 160px;
    bottom: 10px;
    left: 10px;
  }
  
  #map-container {
    height: 120px;
  }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const closeBtn = document.getElementById('close-map');
  const mapWidget = document.getElementById('pageview-map');
  
  if (closeBtn && mapWidget) {
    closeBtn.addEventListener('click', function() {
      mapWidget.style.display = 'none';
      localStorage.setItem('pageview-map-hidden', 'true');
    });
  }
  
  // Check if user previously closed the map
  if (localStorage.getItem('pageview-map-hidden') === 'true') {
    mapWidget.style.display = 'none';
  }
  
  // Simulate real-time updates (optional)
  function updateVisitorCount() {
    const regions = [
      { selector: 'span[style*="color: #ff4444"]', base: 45 },
      { selector: 'span[style*="color: #44ff44"]', base: 23 },
      { selector: 'span[style*="color: #4444ff"]', base: 12 }
    ];
    
    regions.forEach(region => {
      const element = document.querySelector(region.selector);
      if (element) {
        const variation = Math.floor(Math.random() * 5) - 2; // ±2 variation
        const newCount = Math.max(0, region.base + variation);
        element.parentNode.innerHTML = element.parentNode.innerHTML.replace(/\d+/, newCount);
      }
    });
  }
  
  // Update counts every 30 seconds
  setInterval(updateVisitorCount, 30000);
});
</script>
